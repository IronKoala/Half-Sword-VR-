; HalfSwordCustomWeapon test settings. Read again each time the key is pressed.
; Model file in this folder: Wavefront OBJ, Unreal axes, centimetres, blade along +Z from the guard.
model=test_blade.obj
; Windows virtual key code. 0x78 = F9.
key=0x78
; 1 = scale the model so its far end matches the original head's length (keeps the game's damage points at the tip).
fit_to_original=1
; 1 = flip triangle order, if the model shows inside out.
flip_winding=0
; Mass of the new head in kg. 0 = keep the game's mass for the old head.
mass_kg=0
; 1 = hide the invisible collision box (normal). 0 = show it, to see the collision.
hide_original=1
; Own textures: if <model>_BaseColor.png (and _Normal.png, _ORM.png) sit next to the model, they are
; shown through a dynamic copy of own_material, set into its texture parameters tex_base/tex_normal/tex_orm.
; 0 = always keep the game's material.
own_textures=1
own_material=/Game/Assets/Props/Cooking_Utencils/Materials/MI_Prop_Cooking_Utencil_Pot_002.MI_Prop_Cooking_Utencil_Pot_002
tex_base=D
tex_normal=N
tex_orm=ORM
