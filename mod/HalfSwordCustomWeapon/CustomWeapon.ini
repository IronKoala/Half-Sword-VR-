; HalfSwordCustomWeapon test settings. Read again each time the key is pressed.
; Model file in this folder: Wavefront OBJ, Unreal axes, centimetres, blade along +Z from the guard.
model=test_blade.obj
; Windows virtual key code. 0x78 = F9.
key=0x78
; 1 = scale the model so its far end matches the original head's length (keeps the game's damage points at the tip).
fit_to_original=1
; 1 = flip triangle order, if the model shows inside out.
flip_winding=0
; Mass of the new head in kg. 0 = keep the game's mass for the old head.
mass_kg=0
; 1 = hide the invisible collision box (normal). 0 = show it, to see the collision.
hide_original=1
; Own textures: if <model>_BaseColor.png (and _Normal.png, _ORM.png) sit next to the model, they are
; shown through a dynamic copy of own_material, set into its texture parameters tex_base/tex_normal/tex_orm.
; 0 = always keep the game's material.
own_textures=1
own_material=/Game/Assets/Props/Cooking_Utencils/Materials/MI_Prop_Cooking_Utencil_Pot_002.MI_Prop_Cooking_Utencil_Pot_002
tex_base=D
tex_normal=N
tex_orm=ORM
; Hands on the model's handle. 1 = a handle at least two_hand_grip_cm long is held two-handed (the
; game's longsword grip type), a shorter one one-handed, and the off hand is placed on the model's handle.
fit_hands=1
two_hand_grip_cm=14
; Where the off hand goes: pommel = at the handle's end (default), next = beside the main hand (the game's spacing).
offhand=pommel
; Hand slide is chosen PER WEAPON in the converter ("Hand slides down the handle in swings"; hand_slide=1
; in the model's .txt): main hand by the guard, off hand at the pommel end, and the main hand slides down
; to the off hand during a swing (full reach); half-sword grip = main hand at the pommel end, off hand
; just under the guard. Other swords: the half-sword off hand goes halfway up the model's blade.
; swing_slide=0 switches the slide off for every weapon. A swing = the weapon turning faster than swing_slide_start_dps (degrees per
; second); the hand slides back up once it turns slower than swing_slide_end_dps for swing_slide_hold_s.
; swing_slide_down_s / _up_s = seconds for the whole slide down / back up.
swing_slide=1
swing_slide_start_dps=400
swing_slide_end_dps=150
swing_slide_hold_s=0.25
swing_slide_down_s=0.12
swing_slide_up_s=0.4
