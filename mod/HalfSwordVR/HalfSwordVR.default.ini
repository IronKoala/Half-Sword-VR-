; ======================================================================
;  HALF SWORD VR SETTINGS
; ======================================================================
; Edit and save: the mod re-reads this file about once a second while the game runs.
; Each setting is one line, key=value. The line above it (starting with ;) says what it does.
; Lines starting with ; or [ are only notes and headings; never put a note on a value line.
; Each setting appears once. To find one: Ctrl+F its name, or the section number below, e.g. [16.
; Settings from a newer mod version are added under the setting they belong with.
;
; SECTIONS
;    1. Startup
;    2. Test room
;    3. Picture quality and performance
;    4. Eyes and world scale
;    5. Helmet and your own head
;    6. Menus, panel and keys
;    7. Sticks, turning and walking
;    8. Crouch, kick, jump, slow motion
;    9. Body lean and torso
;   10. Body posing, feet and steps
;   11. Your damage and injuries
;   12. Hands on the controllers and arms
;   13. Fingers and grip wrap
;   14. Grabbing
;   15. Sliding the hand along a handle
;   16. Two hands on one weapon
;   17. Holding: weight, arm lag, wrist and shoulder
;   18. Stamina and strength
;   19. Shields and pavise
;   20. Drawing, sheathing, belt
;   21. Swinging, throwing, whoosh
;   22. Stabbing, cutting, hits
;   23. Punches, elbows, grabbing bodies
;   24. Hit vibration
;   25. Eating and drinking
;   26. Old grip spring
;   27. Ghost hand
;   28. Logging and troubleshooting
;   29. Developer test switches


; ======================================================================
;  1. STARTUP
; ======================================================================
[1. Startup]
; Whether the mod and VR start.

; 0 = mod off.
enabled=1

; 1 = VR only when SteamVR is already running as the game starts (else plays flat); 0 = always
; start VR.
vr_auto=1

; Process names that count as SteamVR running.
vr_auto_processes=vrserver.exe,vrmonitor.exe



; ======================================================================
;  2. TEST ROOM
; ======================================================================
[2. Test room]
; The practice arena (Free Mode tavern: Train button).

; 1 = boot straight into the test arena (passive foes, two weapon tables); 0 = normal game. Read
; at launch.
test_room=0

; 1 = in Free Mode the tavern's Train (the fencer) has a Train button that opens the test room.
test_room_button=1

; Foes in the test room (1-10).
test_room_foes=4

; The Free Mode arena the test room opens.
test_room_map=/Game/Maps/Arenas/Map_Arena_Yard

; Foes' tier: -1 random, 0 Beggar .. 8 Lord.
test_room_tier=-1

; Table weapons' tier: -1 random 0-7, 0 Beggar .. 8 Lord.
test_room_weapon_tier=-1

; 1 = a foe out of the fight is replaced.
test_room_respawn=1

; Seconds after a foe is out before his replacement appears.
test_room_respawn_seconds=10

; His body is removed this long after he is out (0 = bodies stay).
test_room_despawn_seconds=7



; ======================================================================
;  3. PICTURE QUALITY AND PERFORMANCE
; ======================================================================
[3. Picture quality and performance]
; Resolution, sharpness, lighting.

; Per-eye resolution as a share of what the headset asks for (1.0 = full).
render_scale=0.75

; Share of the eye the engine draws before upscaling (50-100; -1 = game's own).
screen_percentage=-1

; 0 = none, 0.5-1 = crisper (-1 = game's own).
sharpen=-1

; Bounce-light density: one sample per this many pixels (game 64 flickers; 32/16/8 denser and
; slower; 0 = game's).
light_samples=16

; 0 auto, 1 always decode sRGB, 2 never.
gamma_mode=0

; 1 = keep clouds correct in both eyes.
fix_clouds=1

; 2 or 0.
cloud_mode=2

; 1 = full headset resolution with menus on a panel; 0 = fallback through the game window.
separate_render_target=1

; Pose prediction frames (-1 = automatic).
predict_frames=-1

; A head pose older than this many presented frames is skipped for its picture (-1 = no check).
pose_max_age=2

; Extra engine console commands, separated by semicolons.
extra_commands=

; 1 = game keeps normal speed while the headset sleeps.
idle_helper=1

; Show the left eye in the game window.
mirror_window=1

; 0 = find automatically.
stereo_slot_offset=0



; ======================================================================
;  4. EYES AND WORLD SCALE
; ======================================================================
[4. Eyes and world scale]
; Where your eyes sit in his head and how big the world feels.

; 1 = life size.
world_scale=1

; head = view from his head bone, camera = the game's camera.
anchor=head

; The bone the view sits on with anchor=head.
head_bone=head

; Straight ahead follows aim (mouse) or camera.
heading=aim

; Eyes from the head bone, forward (cm).
eye_forward_cm=9

; ...and up (cm).
eye_up_cm=7

; Smoothing on the head anchor (s; takes physics jitter out).
anchor_smoothing=0.06

; 1 = controllers and headset placed from where he is this frame, not last frame (hands shook
; while walking).
tracking_current_anchor=1

; 1 = your room steps move the view at once (not smoothed), so the world and your hands don't
; swing when his feet follow you.
anchor_room_unsmoothed=1

; Near clip of the eyes, cm. Keep it at 1: at 4 the sides of closed helmets were cut away
; (see-through).
near_clip_cm=1



; ======================================================================
;  5. HELMET AND YOUR OWN HEAD
; ======================================================================
[5. Helmet and your own head]
; What you see of your own head and helmet. Others always see it; it always protects you.

; 1 = your own head isn't drawn in your view (shadow and helmet stay).
hide_own_head=1

; Gore skeleton hidden from this bone up (empty = not hidden).
hide_own_gore_from=neck_01

; Your worn helmet in your view: 0 = drawn (blocks the view like a real one), 1 = helmet hidden
; from you, 2 = everything on your head hidden from you, 3 = clear window (parts near your eyes
; not drawn), 5 = see-through (faded, see helmet_fade_see_through). Others still see it; it still
; protects you.
helmet_view=0

; helmet_view 3: helmet parts closer than this to your eyes aren't drawn (cm; 5-9). Food at your
; mouth that close is cut too.
helmet_window_cm=7

; helmet_view 5: how see-through your helmet is (0 = solid, 0.5 = half, 1 = invisible).
helmet_fade_see_through=0.5

; helmet_view 5 fades only pieces in front of your eyes (visors, barbutes, armets, closed
; sallets); hats and caps stay solid. Mesh names to fade anyway, comma separated (the log names
; them).
helmet_fade_always=

; helmet_view 5: mesh names never to fade, comma separated.
helmet_fade_never=

; helmet_view 5: the faded helmet's metal colour, r,g,b (0-1).
helmet_fade_tint=0.55,0.55,0.58

; helmet_view 5: how metallic the faded helmet looks (0-1).
helmet_fade_metallic=1

; helmet_view 5: how rough/dull the faded helmet looks (0 = mirror, 1 = matte).
helmet_fade_roughness=0.35

; helmet_view 5: the translucent material used (the game's own Datasmith glass material).
helmet_fade_material=/DatasmithContent/Materials/StdTranslucent/M_StdTranslucent.M_StdTranslucent

; helmet_view 4 (experiment, does NOT work yet: test 2026-11-20 found no material input that makes
; the helmet see-through): how much you see through, 0..1.
helmet_see_through=0.5

; helmet_view 4: 0 = screen door through the helmet material, 1 = helmet hidden on alternate
; frames.
helmet_see_through_mode=0

; helmet_view 4 mode 0: the helmet material's texture parameter we replace (test).
helmet_see_through_param=RT_Damage

; helmet_view 4 mode 0: 0 = dither, 1 = all white, 2 = all black (finding what drives the opacity
; mask).
helmet_see_through_test=0



; ======================================================================
;  6. MENUS, PANEL AND KEYS
; ======================================================================
[6. Menus, panel and keys]
; Key codes are Windows virtual keys: 36 Home (recenter), 35 End (panel), 45 Insert (view), 34
; Page Down (mode).

; Show menus/HUD on a floating panel.
ui_panel=1

; 1 = panel only while a menu is up.
ui_panel_auto=0

; Menu panel distance in front of you (m).
ui_distance_m=1.1

; Menu panel width (m).
ui_width_m=1.25

; Menu panel height offset from your eyes (m; negative = lower).
ui_height_offset_m=-0.05

; How solid menus and HUD on the panel are drawn (opacity = brightness x this).
ui_opacity_gain=2

; Dark sheet behind menus (0-1).
ui_menu_backdrop=0.92

; 1 = also use the window's alpha for the panel (only 4 levels: shows rings). Off by default.
ui_use_alpha=0

; Point a controller at the panel to move the mouse; trigger clicks.
ui_pointer=1

; Left menu = Escape; right A held after a won fight = continue.
menu_buttons=1

; Hold right A this long after a won fight = the game's 'Hold G to continue' (s).
menu_continue_hold_s=1

; 1 = wipe the frame-generation stand-in pictures so closed menus and old mouse pointers don't
; stay on the panel.
wipe_standins=1

; Keyboard key that recentres the view (Windows key code; 36 = Home).
recenter_key=36

; Key that shows/hides the menu panel (35 = End).
toggle_ui_key=35

; Key that switches between his head view and the game's own camera (45 = Insert).
toggle_view_key=45

; Key that flips between full-resolution mode and the fallback (34 = Page Down).
toggle_mode_key=34



; ======================================================================
;  7. STICKS, TURNING AND WALKING
; ======================================================================
[7. Sticks, turning and walking]

; Right stick turning: smooth, snap or off.
pose_stick_turn=smooth

; Smooth turn speed (degrees per second).
pose_stick_turn_dps=150

; Snap turn step (degrees).
pose_snap_turn_deg=30

; Left stick walks toward where you look (head) or where your body faces (body).
pose_move_relative=head

; Stick dead zone (0-1).
pose_stick_dead_zone=0.15

; 1 = the left stick walks.
pose_stick_walk=1

; 1 = his body turns to face where you look.
pose_body_turn=1

; 1 = with controllers tracked, the mouse does not turn or tilt him.
pose_mouse_off_with_controllers=1

; ...once you look this far away.
pose_turn_dead_zone_deg=60

; How fast his body turns to catch up with your head (degrees per second).
pose_turn_speed_dps=150

; Past this the hips come round at once.
pose_turn_max_deg=85

; 1 = after a respawn the new body keeps its own facing (0 = the yaw of the last body can be
; written onto it: helmet and body off-centre).
pose_turn_spawn_guard=1

; 1 = at spawn your head and body are measured against the way the body really faces.
pose_calib_body_facing=1



; ======================================================================
;  8. CROUCH, KICK, JUMP, SLOW MOTION
; ======================================================================
[8. Crouch, kick, jump, slow motion]

; Left stick click toggles a crouch this deep (cm; 0 = off).
pose_crouch_button_cm=40

; How fast that crouch goes down and up (cm/s).
pose_crouch_button_cms=120

; 1 = he crouches as low as you do.
pose_crouch=1

; Headset drop below standing that is ignored before he crouches (cm).
pose_crouch_dead_zone_cm=3

; How far his legs crouch him (cm); deeper, he bends forward so his hands still reach your floor.
pose_crouch_max_cm=62

; 1 = deeper than his legs crouch, he bends forward so his hands reach as low as yours.
pose_crouch_bend_for_depth=1

; 1 = crouching keeps his legs on the leg IK (the game's kneel poses sank him 50-100 cm).
pose_crouch_keep_leg_ik=1

; 1 = the game's kneel never takes your legs.
pose_player_no_kneel=1

; 1 = a short tap of right A kicks.
kick_on_a=1

; A press shorter than this (s) is a kick tap.
kick_tap_s=0.35

; 1 = left X is the game's jump: hold, then let go to leap (a quick tap is the game's tap-kick).
jump_on_x=1

; 1 = right stick click toggles the game's slow motion.
slowmo_on_right_stick_click=1



; ======================================================================
;  9. BODY LEAN AND TORSO
; ======================================================================
[9. Body lean and torso]
; His torso follows your head.

; 1 = his torso leans to put his head where yours is.
pose_lean=1

; 1 = he also bends forward/sideways when you tilt your head (pitch/roll); 0 = he only leans to
; where your neck is (closed PR #8/#10's way).
pose_lean_head_angle=0

; Looking down, his chest leans back out of your view by up to this many cm (0 = off).
pose_lean_look_down_back_cm=16

; pose_lean_head_angle 1: how much of your head's downward pitch the torso takes.
pose_lean_pitch_gain=0.7

; Lean first, step after: how far your head can move from his hips (cm) before he steps (0 =
; always step).
pose_lean_step_radius_cm=8

; Hold your head still this long (s) away from his hips and he steps under you (0 = stays leaned).
pose_lean_settle_s=0.8

; Head pitch below the horizon ignored before he bends forward (degrees).
pose_lean_pitch_dead_deg=10

; Most forward bend (degrees; the game's own lean reaches 60).
pose_lean_max_deg=60

; Head roll ignored before he bends sideways (degrees).
pose_lean_roll_dead_deg=5

; How much of your head's roll his torso takes.
pose_lean_roll_gain=0.8

; Most sideways bend (degrees).
pose_lean_side_max_deg=25

; Smoothing of the lean (s; 0 = none).
pose_lean_smooth_s=0.08

; Neck slack allowed on top of your headset's drop when he bends (cm).
pose_lean_slack_cm=4

; Your neck moving slower than this (cm/s) for pose_lean_settle_s counts as holding still.
pose_lean_settle_speed_cms=10

; He leans back at most this far (cm); further back his hips follow.
pose_lean_back_radius_cm=6

; Once your neck passes the step radius he steps: hips back under you over this long (s).
pose_lean_walk_catchup_s=0.15

; Leans and steps are measured this far below your head joint (base of the neck), so nodding or
; tilting your head doesn't move him (0 = at the head joint).
pose_room_neck_base_cm=12

; 1 = past the step radius his hips follow your neck at once, so it never gets further than the
; radius; 0 = he steps all the way under you.
pose_lean_follow_past_radius=1

; pose_lean_follow_past_radius: fastest his hips follow (cm/s).
pose_lean_follow_speed_cms=400

; 1 = the game's own forward bend (crouching, reaching for grabs) is removed, so only your lean
; bends him.
pose_lean_cancel_game_bend=1

; Share of your head's turn the spine and neck take.
pose_torso_twist=0.7



; ======================================================================
;  10. BODY POSING, FEET AND STEPS
; ======================================================================
[10. Body posing, feet and steps]
; Your character posed from the headset and controllers. Mostly internals.

; Master switch for the posed body.
pose_body=0

; 1 = his head turns with your headset.
pose_head=1

; 1 = head held at the headset so the helmet stays still in view.
pose_head_lock=1

; Head lock: most his head moves from where the animation has it (cm; more would stretch the
; neck).
pose_head_lock_max_cm=12

; 1 = his arms reach for your controllers.
pose_arms=1

; 1 = walking around your room moves him (and his capsule) with you.
pose_follow_room=1

; 1 = his capsule only moves when you walk (the game's own pulls, stumbles and dodges are undone).
pose_hold_capsule=1

; 1 = feet stay planted and step.
pose_feet=1

; 1 = the game's kick moves the leg freely; the foot is planted again where it lands.
pose_feet_free_on_kick=1

; Feet stay free this long after a kick fires (s).
pose_feet_kick_free_s=1

; A foot steps once it is this far from where it should be (cm).
pose_step_distance_cm=10

; A foot steps once it is turned this far from where it should be (degrees).
pose_step_angle_deg=30

; How long a step takes standing (s; shorter when moving).
pose_step_time_s=0.3

; How high the foot lifts in a step (cm).
pose_step_lift_cm=10

; How far ahead a walking foot lands (seconds of movement).
pose_step_lead_s=0.2

; 1 = his body, head and worn armour animate every frame (no update-rate skipping).
pose_no_uro=1

; 1 = helmet and head moved to this frame's headset pose just before drawing (stops the helmet
; sliding in front of your eyes).
pose_helmet_late=1

; 1 = his visible body always updates after his posed skeleton.
pose_mesh_after_driver=1

; 1 = body pose written inside his animation update (else the drawn hand showed last frame's
; solve).
pose_in_anim_update=1

; 1 = his skeleton and body tick after physics, so a hand on a held item sits where the item is
; drawn.
pose_post_physics=1

; Smoothing of the capsule's height for his body and the view (s; walking hops ~2 cm).
pose_actor_z_smooth_s=0.08

; 1 = his body moves each frame without teleporting its physics bodies, so held weapons follow
; smoothly.
pose_move_bodies=1

; A jump bigger than this per frame still teleports (cm).
pose_teleport_above_cm=30

; Old floor clamp; only used when pose_capsule_keep_on_floor=0.
pose_capsule_floor_clamp=1

; 1 = his capsule never sinks more than 15 cm under standing height (stops the sink-into-the-floor
; collapse).
pose_capsule_keep_on_floor=1

; 1 = the game's per-step capsule dip is taken out (walking no longer bobs the view ~2 cm twice a
; second).
pose_capsule_no_step_offset=1



; ======================================================================
;  11. YOUR DAMAGE AND INJURIES
; ======================================================================
[11. Your damage and injuries]
; What hurts you and what injuries do.

; 1 = hits on your body hurt you as in the flat game (health, consciousness, bleeding).
player_takes_damage=1

; 1 = bumping into people counts by how fast your body moves into them, not how deep it sinks in
; (walking into someone no longer hurts him).
player_body_contact_speed=1

; Your body part's mass in those bumps is x this (1 = its own mass; higher = harder bumps and
; kicks).
player_body_contact_mass_scale=1

; 1 = log each changed bump ("Body contact:" lines).
player_body_contact_log=1

; 1 = an item pinned or squeezed against you hurts only by how fast it comes into you (real blows
; unchanged).
player_item_contact_speed=1

; 1 = blood from your own cut-off limb stays at the stump (not floating where the limb was).
player_stump_blood=1

; 1 = your bad injuries cripple you: a limb below injury_limb_health, broken, dislocated or cut
; off.
injury_limbs=1

; Limb health below this counts as badly hurt (25 = the game's own bone-break threshold; a bone
; put back gets 25).
injury_limb_health=25

; One bad leg: walk at this share of normal speed.
injury_one_leg_speed=0.5

; 1 = both legs bad: no walking and you fall over until a leg recovers.
injury_two_legs_fall=1

; 1 = a broken back counts as both legs (the game drops both legs' strength).
injury_back_broken_falls=1

; Dislocated (not broken) arm: how far it lags your controller (s).
injury_dislocated_follow_s=0.15

; Dislocated arm: how much it sags below your controller (cm).
injury_dislocated_sag_cm=12

; 1 = swing your controller hard (the game's swing speed over 60) to put a broken arm back, the
; game's own rule.
injury_swing_relocate=1

; 1 = when you die he ragdolls and falls; the view stays on his head.
death_ragdoll=1



; ======================================================================
;  12. HANDS ON THE CONTROLLERS AND ARMS
; ======================================================================
[12. Hands on the controllers and arms]
; Where his hand sits on your controller, arm length, shoulder reach.

; Hand placement on the controller: wrist forward (cm, controller frame).
pose_wrist_forward_cm=-2.7

; ...toward the back of the hand (cm).
pose_wrist_right_cm=2

; ...up (cm).
pose_wrist_up_cm=7.5

; Hand turn relative to the controller, pitch (degrees).
pose_hand_pitch=0

; Hand turn relative to the controller, yaw (degrees).
pose_hand_yaw=0

; Hand turn relative to the controller, roll (degrees).
pose_hand_roll=0

; Fingers tilted this much from the handle (degrees).
pose_knuckle_deg=20

; Your arm length (shoulder to wrist, cm). Measured by holding both arms out and holding B+Y 2 s;
; 0 = not measured.
pose_user_arm_cm=0

; Share of the hand's twist the forearm takes (0-1); the rest shows at the wrist.
pose_forearm_twist_share=0.5

; Elbow swing smoothing (s).
pose_swivel_smooth_s=0.06

; 1 = the elbow is chosen for his drawn hand (on a stopped weapon), as B&S does.
pose_arm_solve_drawn_hand=1

; Shoulder comes forward this much at full reach (0 = off).
pose_shoulder_reach_cm=12

; Shoulder reach starts in the last this many cm of his arm's reach.
pose_shoulder_reach_start_cm=6

; Most collarbone turn for shoulder reach (degrees).
pose_shoulder_reach_max_deg=35

; His left hand bone's name.
hand_bone_left=hand_l

; His right hand bone's name.
hand_bone_right=hand_r



; ======================================================================
;  13. FINGERS AND GRIP WRAP
; ======================================================================
[13. Fingers and grip wrap]
; Finger tracking and how fingers close around what you hold.

; Read SteamVR's finger tracking when offered.
input_hand_tracking=1

; 1 = free fingers follow yours.
pose_fingers_tracked=1

; Smoothing of the tracked fingers (s).
pose_fingers_tau_s=0.05

; 1 = with finger tracking, each finger joint follows your own.
pose_fingers_per_joint=1

; End joint = this x the middle joint's bend (0 = as tracked).
pose_finger_dip_coupling=0.67

; Finger full bend x this at the knuckle.
pose_finger_scale_mcp=1

; ... at the middle joint.
pose_finger_scale_pip=1

; ... at the end joint.
pose_finger_scale_dip=1

; 1 = an empty hand stops at walls and scenery instead of going into them.
pose_hand_world_stop=1

; pose_hand_world_stop: radius of the sphere at the middle of the palm that stops on walls (cm).
pose_hand_world_radius_cm=3.5

; pose_hand_world_stop: that sphere sits this far past the wrist along the fingers (cm).
pose_hand_world_reach_cm=6

; 1 = finger joints bend at the finger's middle (0 = about the game's bones: fingers roll into
; circles).
pose_finger_pivot_fix=1

; 1 = finger joints close in a natural order (no round 'circle' fingers).
pose_finger_schedule=1

; Finger schedule: the knuckle starts bending at this curl (0-1).
pose_finger_mcp_lag=0.25

; Finger schedule: the middle joint is fully bent at this curl (0-1).
pose_finger_pip_full=0.75

; 1 = fingers wrap bodies and loose objects you grab (procedural grab).
pose_wrap=1

; Grip wrap: fingers ease in/out over this long (s).
pose_wrap_ease_s=0.12

; Grip wrap: how often all five fingers are solved again (s).
pose_wrap_refresh_s=0.5

; 0 = the measured finger shape (set a number for one plain radius).
pose_wrap_finger_radius_cm=0

; 1 = on a Willie, fingers feel all of him (jaw, collarbones), not only the part you grabbed.
pose_wrap_all_bodies=1

; A finger that misses what you hold curls like its neighbour, else at most this (0-1).
pose_wrap_untouched_curl=0.45

; 1 = fingers stop at a Willie's skin where it stands outside his collision (neck, collarbones,
; upper back).
pose_wrap_body_pad=1

; Extra palm-side finger thickness with full gauntlets or gloves on.
pose_wrap_gauntlet_pad_cm=0.85

; The same for half gauntlets (first finger segment only).
pose_wrap_halfgauntlet_pad_cm=1

; 1 = a wrapping hand starts from the open hand (not the game's grab shape).
pose_wrap_open_base=1

; 1 = finger shapes go only to the animation's copy of the grip type, so the game's two-hand rules
; never see them.
pose_fingers_anim_only=1



; ======================================================================
;  14. GRABBING
; ======================================================================
[14. Grabbing]
; Picking things up: reach, handles, how an item seats in the hand.

; 1 = squeeze grip near a loose weapon to pick it up.
pose_grab_button=1

; 1 = letting go of grip drops what that hand holds.
pose_grab_release_drops=1

; 1 = squeezing near a loose object or a body grabs it (the game's own grab).
pose_grab_objects=1

; 1 = fixed scenery (fence, table, wall) can be held.
pose_grab_world=1

; Old grab: search radius around the hand (cm; used when pose_grab_handles=0).
pose_grab_radius_cm=18

; How far from an item your palm can be and still grab it (cm).
pose_grab_touch_cm=10

; 1 = B&S-style handle grabbing.
pose_grab_handles=1

; A grab lands on the nearest handle within this distance (cm).
pose_grab_handle_cm=10

; 1 = a weapon is taken only by a handle (grip, haft, blade), not anywhere you touch it.
pose_grab_weapon_handles_only=1

; Grabbed item eases into the hand over this long (s).
pose_grab_settle_s=0.08

; 1 = a weapon taken by grip or blade sits at the game's own seat in the hand.
pose_grab_seat=1

; A reversed seat must be this much nearer to win (degrees).
pose_grab_seat_reverse_bias_deg=45

; 1 = what you grab sits on your palm, not inside the fist.
pose_grab_seat_palm=1

; Palm point: this far from the hand bone toward the palm (cm).
pose_grab_palm_cm=2

; On scenery the palm stays this far off the surface (cm; the hand sat half in the fence).
pose_grab_scenery_gap_cm=1.5

; Palm point: this share of the way from the hand bone to the middle knuckle.
pose_grab_palm_along=0.5

; 1 = when his arm can't reach your hand (floor), a squeeze grabs at your controller and pulls it
; to him.
pose_grab_from_controller=1

; His hand this far short of yours (cm) before grabbing at the controller.
pose_grab_controller_gap_cm=4

; Never grab at the controller from farther than this (cm).
pose_grab_controller_max_cm=60

; 1 = a weapon taken away from its grip is held where the hand closed. 0 = snapped onto the grip.
