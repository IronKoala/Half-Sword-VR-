; How far his head turns freely (degrees from where it was when you took hold) before a twist strains the neck.
joint_break_twist_free_neck_deg=60
; Same for a twist of his upper arm in the shoulder.
joint_break_twist_free_arm_deg=60
; Same for a twist of his back.
joint_break_twist_free_back_deg=30
; A twist past the free range counts as a bend of that many times the extra degrees.
joint_break_twist_gain=2
; Knees can be strained and dislocated too (calf bent against the thigh).
joint_break_legs=0
; How fast joints strain (1 = the old game).
joint_break_scale=1
log_body_hits=1
stab_log=1
hit_buzz_log=1
perf_log_seconds=10
strength_log_seconds=10
; 1 = with each Perf line, time the game's Blueprint calls per class (troubleshooting, ~1 ms a frame).
perf_events=0
; 1 = with each Perf line, sample where the game thread spends its time (troubleshooting).
perf_sample=0
; 1 = with each Perf line, time Willie's tick graph by bytecode segment (troubleshooting).
perf_bp_segments=0
; Troubleshooting pictures every this many seconds (0 = off).
capture_seconds=0
capture_menus_only=0
haptics_test=0

