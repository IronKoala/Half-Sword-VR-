[Picture and view]
; Where your eyes sit and how the picture is made.
; 1 = life size.
world_scale=1
; head = view from his head bone, camera = the game's camera.
anchor=head
head_bone=head
; Straight ahead follows aim (mouse) or camera.
heading=aim
; Eyes from the head bone, forward (cm).
eye_forward_cm=9
; ...and up (cm).
eye_up_cm=7
; Smoothing on the head anchor (s; takes physics jitter out).
anchor_smoothing=0.06
tracking_current_anchor=1
; Near clip of the eyes, cm. Keep it at 1: at 4 the sides of closed helmets were cut away (see-through).
near_clip_cm=1
; 0 auto, 1 always decode sRGB, 2 never.
gamma_mode=0
; 1 = full headset resolution with menus on a panel; 0 = fallback through the game window.
separate_render_target=1
; Pose prediction frames (-1 = automatic).
predict_frames=-1
pose_max_age=2
; 1 = keep clouds correct in both eyes.
fix_clouds=1
; 2 or 0.
cloud_mode=2
; Extra engine console commands, separated by semicolons.
extra_commands=
; 1 = game keeps normal speed while the headset sleeps.
idle_helper=1
; Show the left eye in the game window.
mirror_window=1
; 0 = find automatically.
stereo_slot_offset=0

