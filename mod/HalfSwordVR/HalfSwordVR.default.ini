; ======================================================================
;  28. LOGGING AND TROUBLESHOOTING
; ======================================================================
[28. Logging and troubleshooting]
; These change nothing in the game.

; 1 = log the view anchor and camera once a second.
log_poses=0

; 1 = record every tick to logs\frames-<time>.csv (headset, controllers, hands, held items).
log_frames=1

; 1 = log input: keyboard focus, Esc and menu clicks, sticks, turn speed.
log_input=1

; 1 = log menu sliders when they change.
log_sliders=0

; 1 = log controller positions and buttons once a second.
log_controllers=1

; 1 = log his body, head and hands once a second.
log_body=0

; 1 = log finger bends once a second while posed.
log_fingers=1

; Test: log which component a held weapon hits or is held off by (writes a lot).
hold_blocker_log=0

; 1 = log the grip wrap and grab pull.
log_wrap=1

; 1 = log body grabs every 0.1 s.
log_body_grab=1

; Log a held Willie's joint bends, twists and dislocation state.
log_joint_strain=1

; Bending or twisting a held Willie's neck, shoulders or back past their range strains them (the
; old game's rules): the neck snaps, a shoulder dislocates, the back breaks.
joint_break=1

; How far his head turns freely (degrees from where it was when you took hold) before a twist
; strains the neck.
joint_break_twist_free_neck_deg=60

; Same for a twist of his upper arm in the shoulder.
joint_break_twist_free_arm_deg=60

; Same for a twist of his back.
joint_break_twist_free_back_deg=30

; A twist past the free range counts as a bend of that many times the extra degrees.
joint_break_twist_gain=2

; Knees can be strained and dislocated too (calf bent against the thigh).
joint_break_legs=0

; How fast joints strain (1 = the old game).
joint_break_scale=1

; 1 = log other Willies' body hits.
log_body_hits=1

; 1 = log every held-weapon hit on a person ('Stab:' lines).
stab_log=1

; 1 = log every hit buzz.
hit_buzz_log=1

; 1 = log 'Whoosh:' lines while a held weapon moves fast.
whoosh_log=1

; Whoosh log from this speed (cm/s).
whoosh_log_min_speed=300

; A 'Perf:' line every this many seconds (0 = off).
perf_log_seconds=10

; A 'Strength:' training line every this many seconds (0 = off).
strength_log_seconds=10

; 1 = with each Perf line, time the game's Blueprint calls per class (troubleshooting, ~1 ms a
; frame).
perf_events=0

; 1 = with each Perf line, sample where the game thread spends its time (troubleshooting).
perf_sample=0

; 1 = with each Perf line, time Willie's tick graph by bytecode segment (troubleshooting).
perf_bp_segments=0

; Troubleshooting pictures every this many seconds (0 = off).
capture_seconds=0

; 1 = screen captures only while a menu is up.
capture_menus_only=0

; 1 = a short buzz each time a trigger is pulled all the way.
haptics_test=0



