; Glove offset Y (cm).
pose_ghost_y_cm=0

; Glove offset Z (cm).
pose_ghost_z_cm=0

; Glove turn pitch (degrees).
pose_ghost_pitch=180

; Glove turn yaw (degrees).
pose_ghost_yaw=0

; Glove turn roll (degrees).
pose_ghost_roll=0

; Glove scale.
