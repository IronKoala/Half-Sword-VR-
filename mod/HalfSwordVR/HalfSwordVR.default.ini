pose_grab_body_damper=400

; Body grab force cap x his grip strength (0 = use pose_grab_body_max).
pose_grab_body_cap_per_t=450

; Fixed body grab force cap.
pose_grab_body_max=250000

; Hand this far from a grabbed body's spot for 0.3 s lets go (cm).
pose_grab_body_let_go_cm=30

; 1 = the game's grip slip is off while you hold a body (your tracked hand tripped it); pulling
; away lets go instead.
pose_grab_body_no_slip=1

; Below this grip strength (broken or numb arm) the game's slip still applies.
pose_grab_body_slip_below_t=20



; ======================================================================
;  24. HIT VIBRATION
; ======================================================================
[24. Hit vibration]
; Controller buzz on hits.

; Hit vibration strength (0 = off, 1 = like Blade & Sorcery).
hit_buzz=1

; Scrape ticks while a blade slides along something (0 = off).
hit_buzz_scrape=1

; 1 = blade on plate armour buzzes too (B&S is silent there).
hit_buzz_blade_on_plate=1

; 1 = a weapon's own parts hitting each other (flail head on its haft) never buzz.
hit_buzz_ignore_self=1

; Below this (0-1) a contact is a touch, not a hit: no buzz.
hit_buzz_min_intensity=0.05

; Game impulse that counts as a full-strength blow on a held item.
hit_buzz_impulse_full=3000

; An open hand or arm on a person buzzes only above this speed (m/s).
hit_buzz_limb_min_ms=3



; ======================================================================
;  25. EATING AND DRINKING
; ======================================================================
[25. Eating and drinking]

; 1 = food at your mouth is bitten; a tipped bottle at your mouth is drunk from.
pose_eat=1

; Food this close to your mouth is bitten (cm).
pose_eat_cm=12

; Bottle neck must point lower than this to drink (-1 to 1; 0 = level).
pose_drink_tip=0

; Seconds between sips.
pose_drink_sip_s=1



; ======================================================================
;  26. OLD GRIP SPRING
; ======================================================================
[26. Old grip spring]
; Only used when pose_grip_hold=0.

; Old grip spring on (only with pose_grip_hold=0).
pose_grip_spring=1

; Most it holds up (kg).
pose_grip_strength_kg=20

; How briskly it follows (Hz).
pose_grip_hz=20

; Damping ratio.
pose_grip_damping=0.3

; Lever used for turning strength (cm).
pose_grip_radius_cm=30

; Buzz strength for the gap (0 = off).
pose_grip_buzz=0.6

; Buzz starts past this stretch (cm).
pose_grip_buzz_from_cm=10

; Turning stiffness multiplier.
pose_grip_turn_scale=4

; Turning damping ratio.
pose_grip_turn_damping=0.3

; Turning cap multiplier.
pose_grip_turn_max_scale=100

; 1 = hold at the weapon's handle marker; 0 = the game's joint anchor.
pose_grip_anchor_marker=0



; ======================================================================
;  27. GHOST HAND
; ======================================================================
[27. Ghost hand]
; Off (you didn't like it).

; 1 = a see-through glove shows your real hand when his is stuck on a weapon (off: you disliked
