; Half Sword VR settings. Edit and save: the mod re-reads this file about once a second while the game runs.
; Format: key=value, one per line. Lines starting with ; are notes. [Section] lines are only headings.
; The most-changed settings are in [Quick settings] at the top; each setting appears once in the file.
; New settings from a newer mod version are added under the setting they belong with.

[Quick settings]
; The ones you are most likely to change. Each is in only this place.
; 1 = boot straight into the test arena (passive foes, two weapon tables); 0 = normal game. Read at launch.
test_room=0
; Foes in the test room (1-10).
test_room_foes=4
; Per-eye resolution as a share of what the headset asks for (1.0 = full).
render_scale=0.75
; Share of the eye the engine draws before upscaling (50-100; -1 = game's own).
screen_percentage=-1
; 0 = none, 0.5-1 = crisper (-1 = game's own).
sharpen=-1
; Bounce-light density: one sample per this many pixels (game 64 flickers; 32/16/8 denser and slower; 0 = game's).
light_samples=16
; Right stick turning: smooth, snap or off.
pose_stick_turn=smooth
; Smooth turn speed (degrees per second).
pose_stick_turn_dps=150
; Snap turn step (degrees).
pose_snap_turn_deg=30
; Left stick walks toward where you look (head) or where your body faces (body).
pose_move_relative=head
; Stick dead zone (0-1).
pose_stick_dead_zone=0.15
; Left stick click toggles a crouch this deep (cm; 0 = off).
pose_crouch_button_cm=40
; How fast that crouch goes down and up (cm/s).
pose_crouch_button_cms=120
; 1 = a short tap of right A kicks.
kick_on_a=1
; A press shorter than this (s) is a kick tap.
kick_tap_s=0.35
; 1 = left X is the game's jump: hold, then let go to leap (a quick tap is the game's tap-kick).
jump_on_x=1
; 1 = right stick click toggles the game's slow motion.
slowmo_on_right_stick_click=1
; 1 = held weapons trail your hand like flat Half Sword's arm (heavier = more lag).
pose_hold_arm_lag=1
; Empty-arm follow delay (s); weapons add to it by their weight. Flat game ~0.1.
pose_hold_arm_lag_s=0.05
; Most lag any weapon gets (s).
pose_hold_arm_lag_max_s=0.25
; Heft floor: a weapon lags at least this x sqrt(its inertia about the shoulder) (s), so a greatsword never swings like a dagger.
pose_hold_heft_lag_s=0.11
; Multiplier on the whole hold (force and turning).
pose_hold_strength=1
; Most force one hand puts on a held item (N, x his strength).
pose_hold_max_force=3000
; Wrist strength: most turning force one hand has at the grip (N m, x his strength).
pose_hold_max_torque=30
; Wrist end stop: turning limit once the item is bent past the free angle (N m).
pose_hold_wrist_stop_torque=250
; Shoulder strength against swinging arm + weapon (N m; 0 = off). Lower = heavy weapons trail more.
pose_hold_shoulder_torque=110
; Two hands on one weapon hold this many times as strong.
pose_two_hand_strength=2
; Stamina cost of holding and swinging (1 = the game's own formula, fed from the hold).
pose_stamina_scale=1
; Thrown weapon speed x this (B&S 2).
pose_throw_multiplier=2
; How far from an item your palm can be and still grab it (cm).
pose_grab_touch_cm=10
; Hit vibration strength (0 = off, 1 = like Blade & Sorcery).
hit_buzz=1
; Scrape ticks while a blade slides along something (0 = off).
hit_buzz_scrape=1
; 1 = blade on plate armour buzzes too (B&S is silent there).
hit_buzz_blade_on_plate=1
; 1 = a weapon's own parts hitting each other (flail head on its haft) never buzz.
hit_buzz_ignore_self=1
; Below this (0-1) a contact is a touch, not a hit: no buzz.
hit_buzz_min_intensity=0.05
; 1 = your torso leans when you look down/sideways, so armour stays out of view.
pose_lean=1
; How much of your head's downward pitch the torso takes.
pose_lean_pitch_gain=0.7
; Lean first, step after: how far your head can move from his hips (cm) before he steps (0 = always step).
pose_lean_step_radius_cm=30
; 1 = your own head isn't drawn in your view (shadow and helmet stay).
hide_own_head=1
; Your worn helmet in your view: 0 = drawn (blocks the view like a real one), 1 = helmet hidden from you, 2 = everything on your head hidden from you, 3 = clear window (parts near your eyes not drawn), 5 = see-through (faded, see helmet_fade_see_through). Others still see it; it still protects you.
helmet_view=0
; helmet_view 3: helmet parts closer than this to your eyes aren't drawn (cm; 5-9). Food at your mouth that close is cut too.
helmet_window_cm=7
; helmet_view 5: how see-through your helmet is (0 = solid, 0.5 = half, 1 = invisible).
helmet_fade_see_through=0.5
; helmet_view 5: the faded helmet's metal colour, r,g,b (0-1).
helmet_fade_tint=0.55,0.55,0.58
; helmet_view 5: how metallic the faded helmet looks (0-1).
helmet_fade_metallic=1
; helmet_view 5: how rough/dull the faded helmet looks (0 = mirror, 1 = matte).
helmet_fade_roughness=0.35
; helmet_view 5: the translucent material used (the game's own Datasmith glass material).
helmet_fade_material=/DatasmithContent/Materials/StdTranslucent/M_StdTranslucent.M_StdTranslucent
; helmet_view 4 (experiment, does NOT work yet: test 2026-11-20 found no material input that makes the helmet see-through): how much you see through, 0..1.
helmet_see_through=0.5
; helmet_view 4: 0 = screen door through the helmet material, 1 = helmet hidden on alternate frames.
helmet_see_through_mode=0
; helmet_view 4 mode 0: the helmet material's texture parameter we replace (test).
helmet_see_through_param=RT_Damage
; helmet_view 4 mode 0: 0 = dither, 1 = all white, 2 = all black (finding what drives the opacity mask).
helmet_see_through_test=0
; Hand placement on the controller: wrist forward (cm, controller frame).
pose_wrist_forward_cm=-2.7
; ...toward the back of the hand (cm).
pose_wrist_right_cm=2
; ...up (cm).
pose_wrist_up_cm=7.5
; Hand turn relative to the controller (degrees).
pose_hand_pitch=0
pose_hand_yaw=0
pose_hand_roll=0
; Fingers tilted this much from the handle (degrees).
pose_knuckle_deg=20
; Your arm length (shoulder to wrist, cm). Measured by holding both arms out and holding B+Y 2 s; 0 = not measured.
pose_user_arm_cm=0

[Startup]
; Whether the mod and VR start.
; 0 = mod off.
enabled=1
; 1 = VR only when SteamVR is already running as the game starts (else plays flat); 0 = always start VR.
vr_auto=1
; Process names that count as SteamVR running.
vr_auto_processes=vrserver.exe,vrmonitor.exe

