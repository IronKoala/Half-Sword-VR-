; Lowest picture for TEST COPIES only (tools/pctest/new-testcopy.ps1 puts it in <copy>\user\Saved\Config\Windows\Engine.ini).
; His own game never reads this file. Every line here only changes how things are DRAWN.
; Left out on purpose (they can change what the game simulates or what the mod reads):
;   r.SkeletalMeshLODBias        low-detail meshes can drop bones (fingers first): grip, finger and hand checks read them
;   r.ViewDistanceScale / r.CullDistanceScale   characters not drawn can skip their animation update
;   foliage.DensityScale / grass  scalable foliage instances can carry collision
;   r.EmitterSpawnRateScale       particles (kept as in play)
; t.MaxFPS is set by the runner's ini/console step, not here (72 = the headset's rate).
